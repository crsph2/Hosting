<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathQuest</title>
    <!-- Aquí irían tus enlaces a CSS -->
</head>
<body>

<main class="quest-container">
  <section class="login-card">
    <header>
      <h1 class="game-title">⚔️ MathQuest</h1>
      <p class="game-subtitle">Elige tu nombre de aventurero para comenzar la misión</p>
    </header>

    <form id="player-form" class="player-form">
      <label for="adventurer-name" class="sr-only">Nombre de aventurero</label>
      
      <input 
        type="text" 
        id="adventurer-name" 
        name="adventurer-name" 
        class="rpg-input"
        placeholder="Ej. Mago de los Números" 
        required 
        minlength="3" 
        maxlength="15" 
        autocomplete="off"
        autofocus
      />
      
      <button type="submit" class="rpg-button btn-primary">
        ¡Iniciar Aventura!
      </button>
    </form>
    
    <div id="error-message" class="error-feedback hidden" aria-live="polite"></div>
  </section>
</main>

<!-- ¡IMPORTANTE! Aquí se carga tu JavaScript -->
<script src="app.js"></script>

</body>
</html>
