<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MathQuest - Aventura Matemática</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app">
  <!-- Pantalla de nickname (primera vez o si no tiene) -->
  <div id="pantalla-nickname" class="pantalla">
    <div class="centrado">
      <h1>⚔️ MathQuest</h1>
      <p>Elige tu nombre de aventurero</p>
      <input type="text" id="input-nickname" placeholder="Nickname único" maxlength="20">
      <button class="boton" id="btn-guardar-nick">Comenzar aventura</button>
      <div id="mensaje-nick" class="mensaje"></div>
    </div>
  </div>

  <!-- Pantalla principal del juego -->
  <div id="pantalla-juego" class="pantalla oculta">
    <!-- Barra superior -->
    <div class="barra-superior">
      <span id="nickname-display">Jugador</span>
      <span>🏆 <span id="xp-display">0</span> XP</span>
      <span>🪙 <span id="monedas-display">0</span></span>
      <button id="btn-cerrar-sesion" class="boton small">Salir</button>
    </div>
    <!-- Navegación -->
    <nav class="nav-juego">
      <button class="nav-btn" data-vista="mapa">🗺️ Mapa</button>
      <button class="nav-btn" data-vista="perfil">👤 Perfil</button>
      <button class="nav-btn" data-vista="ranking">🏅 Ranking</button>
      <button class="nav-btn" data-vista="retos">⚡ Retos</button>
    </nav>
    <!-- Contenido dinámico -->
    <div id="contenido-juego">
      <!-- Vista Mapa -->
      <div id="vista-mapa" class="vista">
        <h2>Regiones</h2>
        <div id="mapa-regiones"></div>
      </div>
      <!-- Vista Perfil -->
      <div id="vista-perfil" class="vista oculta">
        <h2>Mi perfil</h2>
        <div id="perfil-info"></div>
        <button class="boton secundario" id="btn-admin-panel" style="display:none;">🔧 Panel Admin</button>
      </div>
      <!-- Vista Ranking -->
      <div id="vista-ranking" class="vista oculta">
        <h2>🏅 Ranking Global</h2>
        <div id="ranking-lista"></div>
      </div>
      <!-- Vista Retos -->
      <div id="vista-retos" class="vista oculta">
        <h2>⚡ Retos</h2>
        <div id="retos-pendientes"></div>
        <h3>Desafiar a otro</h3>
        <input type="text" id="reto-nickname" placeholder="Nickname del rival">
        <button class="boton" id="btn-enviar-reto">Enviar reto</button>
        <div id="mensaje-reto" class="mensaje"></div>
      </div>
      <!-- Vista Admin -->
      <div id="vista-admin" class="vista oculta">
        <h2>🔧 Panel Administrador</h2>
        <div id="admin-botones">
          <button class="boton" data-admin="reset-ranking">Reiniciar ranking</button>
          <button class="boton" data-admin="reset-monedas">Reiniciar monedas</button>
          <button class="boton" data-admin="reset-progreso">Reiniciar progreso</button>
          <button class="boton" data-admin="reset-temporada">Reiniciar temporada</button>
          <button class="boton" data-admin="bloquear">Bloquear usuario</button>
          <button class="boton" data-admin="desbloquear">Desbloquear usuario</button>
        </div>
        <div id="mensaje-admin" class="mensaje"></div>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
