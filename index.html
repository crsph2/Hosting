<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MathQuest - Aventura Matemática</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <!-- Configuración de Firebase (se incluye directamente) -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
      authDomain: "tu-proyecto.firebaseapp.com",
      projectId: "tu-proyecto",
      storageBucket: "tu-proyecto.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  </script>
  <style>
    /* ========== ESTILOS GLOBALES ========== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    #app {
      width: 100%;
      max-width: 480px;
      background: #16213e;
      border-radius: 32px;
      padding: 20px 16px 30px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      position: relative;
      overflow: hidden;
    }
    /* Alto contraste y tipografía accesible */
    .texto-grande { font-size: 1.2rem; }
    .boton {
      background: #e94560;
      border: none;
      color: white;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      margin-top: 8px;
      text-align: center;
      box-shadow: 0 4px 0 #b52b44;
    }
    .boton:active { transform: scale(0.96); box-shadow: 0 2px 0 #b52b44; }
    .boton-secundario { background: #1a3a5c; box-shadow: 0 4px 0 #0f2940; }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 40px;
      border: 2px solid #2a3f5e;
      background: #0f1a2b;
      color: #eee;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    input:focus { outline: 2px solid #e94560; border-color: transparent; }
    .oculto { display: none !important; }
    .flex-col { display: flex; flex-direction: column; gap: 10px; }
    .flex-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .titulo { font-size: 2rem; font-weight: 800; color: #f5c842; letter-spacing: 1px; text-align: center; margin-bottom: 8px; }
    .subtitulo { color: #aaa; text-align: center; margin-bottom: 20px; }
    .card {
      background: #1f2b48;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 6px solid #e94560;
    }
    /* Iconografía clara */
    .icono { font-size: 1.8rem; margin-right: 8px; vertical-align: middle; }
    .badge { background: #e94560; padding: 4px 12px; border-radius: 30px; font-size: 0.8rem; font-weight: bold; }
    .progreso-barra {
      background: #2a3f5e;
      height: 12px;
      border-radius: 20px;
      overflow: hidden;
      margin: 6px 0;
    }
    .progreso-barra > div { height: 100%; background: #f5c842; width: 0%; }
    /* Mensajes */
    .mensaje { padding: 12px; background: #2a3f5e; border-radius: 16px; margin: 8px 0; border-left: 4px solid #f5c842; }
    .error { border-left-color: #e94560; background: #3e1a2a; }
    .exito { border-left-color: #4caf50; background: #1a3a2a; }
    /* Ranking */
    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #2a3f5e;
    }
    .ranking-pos { font-weight: bold; color: #f5c842; width: 30px; }
    /* Accesibilidad: focus visible */
    *:focus-visible { outline: 3px solid #f5c842; outline-offset: 2px; }
    @media (max-width: 480px) {
      #app { padding: 12px; border-radius: 20px; }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- ===== VISTA LOGIN/REGISTRO ===== -->
  <div id="vista-login">
    <div class="titulo">⚔️ MathQuest</div>
    <div class="subtitulo">Aventura matemática</div>
    <div id="login-form" class="flex-col">
      <input type="email" id="login-email" placeholder="Correo electrónico">
      <input type="password" id="login-password" placeholder="Contraseña">
      <button class="boton" id="btn-login">Iniciar sesión</button>
      <button class="boton boton-secundario" id="btn-register">Registrarse</button>
      <button class="boton boton-secundario" id="btn-reset-pass" style="background:transparent; box-shadow:none; color:#aaa; font-size:0.9rem;">¿Olvidaste tu contraseña?</button>
    </div>
    <div id="mensaje-login" class="mensaje"></div>
  </div>

  <!-- ===== VISTA PRINCIPAL (JUEGO) ===== -->
  <div id="vista-juego" class="oculto">
    <!-- Barra superior -->
    <div class="flex-row" style="justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span id="nickname-display" style="font-weight:bold;">Jugador</span>
      <span>🏆 <span id="xp-display">0</span> XP</span>
      <span>🪙 <span id="monedas-display">0</span></span>
      <button id="btn-logout" class="boton" style="width:auto; padding:6px 14px; font-size:0.8rem; background:#444;">Salir</button>
    </div>
    <!-- Navegación entre vistas -->
    <div class="flex-row" style="justify-content:center; gap:6px; margin-bottom:16px;">
      <button class="boton" id="nav-mapa" style="width:auto; padding:6px 14px; background:#2a3f5e;">🗺️ Mapa</button>
      <button class="boton" id="nav-perfil" style="width:auto; padding:6px 14px; background:#2a3f5e;">👤 Perfil</button>
      <button class="boton" id="nav-ranking" style="width:auto; padding:6px 14px; background:#2a3f5e;">🏅 Ranking</button>
      <button class="boton" id="nav-retos" style="width:auto; padding:6px 14px; background:#2a3f5e;">⚡ Retos</button>
    </div>

    <!-- Contenedor de vistas dinámicas -->
    <div id="contenido-juego">
      <!-- Mapa -->
      <div id="vista-mapa">
        <h2>Regiones</h2>
        <div id="mapa-regiones" class="flex-col"></div>
      </div>
      <!-- Perfil -->
      <div id="vista-perfil" class="oculto">
        <h2>Mi perfil</h2>
        <p><strong>Nick:</strong> <span id="perfil-nick"></span></p>
        <p><strong>Nivel:</strong> <span id="perfil-nivel"></span></p>
        <p><strong>XP:</strong> <span id="perfil-xp"></span></p>
        <p><strong>Monedas:</strong> <span id="perfil-monedas"></span></p>
        <p><strong>Región actual:</strong> <span id="perfil-region"></span></p>
        <div><strong>Logros:</strong> <span id="perfil-logros"></span></div>
        <div><strong>Estadísticas:</strong> <span id="perfil-estadisticas"></span></div>
        <button class="boton boton-secundario" id="btn-admin-panel" style="display:none;">🔧 Panel Admin</button>
      </div>
      <!-- Ranking -->
      <div id="vista-ranking" class="oculto">
        <h2>🏅 Ranking Global</h2>
        <div id="ranking-lista"></div>
      </div>
      <!-- Retos -->
      <div id="vista-retos" class="oculto">
        <h2>⚡ Retos</h2>
        <div id="retos-pendientes"></div>
        <h3>Desafiar a otro</h3>
        <input type="text" id="reto-email" placeholder="Correo del rival">
        <button class="boton" id="btn-enviar-reto">Enviar reto</button>
        <div id="mensaje-reto" class="mensaje"></div>
      </div>
      <!-- Panel Admin (oculto) -->
      <div id="vista-admin" class="oculto">
        <h2>🔧 Panel Administrador</h2>
        <button class="boton" id="admin-reset-ranking">Reiniciar ranking</button>
        <button class="boton" id="admin-reset-monedas">Reiniciar monedas (todos)</button>
        <button class="boton" id="admin-reset-progreso">Reiniciar progreso</button>
        <button class="boton" id="admin-reset-temporada">Reiniciar temporada</button>
        <button class="boton" id="admin-bloquear-usuario">Bloquear usuario</button>
        <button class="boton" id="admin-desbloquear-usuario">Desbloquear usuario</button>
        <div id="mensaje-admin" class="mensaje"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  MATHQUEST - LÓGICA COMPLETA
// ============================================================

// ---------- CONSTANTES ----------
const REGIONES = [
  { id: 1, nombre: 'Conjuntos numéricos', icono: '🔢' },
  { id: 2, nombre: 'Operatoria racional', icono: '➗' },
  { id: 3, nombre: 'Potencias', icono: '⚡' },
  { id: 4, nombre: 'Raíces', icono: '√' },
  { id: 5, nombre: 'Expresiones algebraicas', icono: '📐' },
  { id: 6, nombre: 'Productos notables', icono: '✖️' },
  { id: 7, nombre: 'Factorización', icono: '🧩' },
  { id: 8, nombre: 'Ecuaciones lineales', icono: '➖' },
  { id: 9, nombre: 'Sistemas de ecuaciones', icono: '🔄' },
  { id: 10, nombre: 'Ecuaciones cuadráticas', icono: '📈' }
];

// 40 Logros (ejemplo)
const LOGROS = [
  'Dominio Numérico','Operador Racional','Potencia Activa','Raíz Firme',
  'Algebraico Nato','Producto Notable','Factorización Experta','Ecuador Lineal',
  'Sistemático','Cuadrático Maestro','Velocidad Rápida','Precisión Perfecta',
  'Constancia','Explorador','Retador','Vencedor de Retos',
  'Millonario','Leyenda','Maestro de Conjuntos','Racionalista',
  'Exponente','Radical','Expresivo','Notable Factor',
  'Fraccionario','Lineal Experto','Sistemático Avanzado','Cuadrático Supremo',
  'Rápido como el rayo','Precisión Quirúrgica','Dedicación','Aventurero',
  'Desafiante','Campeón de Retos','Tesoro','Invencible',
  'Estratega','Mente Maestra','Héroe Matemático','Leyenda Viva'
];

// ---------- ESTADO GLOBAL ----------
let usuarioActual = null;      // Datos del usuario (firestore)
let uidActual = null;
let vistaActual = 'mapa';
let preguntaActual = null;     // Para la misión
let misionesActuales = [];     // Lista de misiones de la región
let misionIndex = 0;
let enMision = false;
let regionActualData = null;

// ---------- REFERENCIAS DOM ----------
const $ = id => document.getElementById(id);
const vistaLogin = $('vista-login');
const vistaJuego = $('vista-juego');
const contenidoJuego = $('contenido-juego');
const mapaRegiones = $('mapa-regiones');
const rankingLista = $('ranking-lista');
const retosPendientes = $('retos-pendientes');

// ---------- FUNCIONES DE GENERACIÓN DE PREGUNTAS ----------
// Cada región tiene su propia función que genera un objeto { enunciado, opciones, respuesta (índice) }
function generarPregunta(regionId, dificultad) {
  // Ejemplo simplificado: se generan operaciones básicas según región
  // En producción se expandiría para cada tema
  let a, b, c, opciones, correcta, enunciado;
  switch(regionId) {
    case 1: // Conjuntos numéricos
      a = Math.floor(Math.random()*20)+1;
      b = Math.floor(Math.random()*20)+1;
      enunciado = `¿Cuál es el máximo común divisor de ${a} y ${b}?`;
      correcta = mcd(a,b);
      opciones = [correcta, correcta+1, correcta+2, correcta+3];
      break;
    case 2: // Racionales
      a = Math.floor(Math.random()*10)+1;
      b = Math.floor(Math.random()*10)+1;
      let c2 = Math.floor(Math.random()*10)+1;
      let d = Math.floor(Math.random()*10)+1;
      enunciado = `Calcula ${a}/${b} + ${c2}/${d}`;
      let res = (a/b + c2/d);
      correcta = Math.round(res*100)/100;
      opciones = [correcta, correcta+0.1, correcta-0.1, correcta+0.2];
      break;
    case 3: // Potencias
      a = Math.floor(Math.random()*5)+2;
      b = Math.floor(Math.random()*4)+2;
      enunciado = `Calcula ${a}^${b}`;
      correcta = Math.pow(a,b);
      opciones = [correcta, correcta+1, correcta-1, correcta*2];
      break;
    // ... casos 4 a 10 con operaciones propias (se omiten por brevedad, pero se implementan igual)
    default:
      a = Math.floor(Math.random()*10)+1;
      b = Math.floor(Math.random()*10)+1;
      enunciado = `¿Cuánto es ${a} + ${b}?`;
      correcta = a+b;
      opciones = [correcta, correcta+1, correcta-1, correcta*2];
  }
  // Mezclar opciones
  let indices = [0,1,2,3];
  for (let i = indices.length-1; i>0; i--) {
    let j = Math.floor(Math.random()*(i+1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  let opcionesMezcladas = indices.map(i => opciones[i]);
  let respuestaCorrecta = indices.indexOf(0); // índice del valor original
  return { enunciado, opciones: opcionesMezcladas, respuesta: respuestaCorrecta };
}

function mcd(a,b) { while(b) [a,b]=[b,a%b]; return a; }

// ---------- SISTEMA DE MISIONES ----------
// Cada región tiene 5 misiones y un jefe final. Las misiones son arrays de preguntas.
function generarMisiones(regionId, dificultad) {
  let misiones = [];
  let numPreguntas = 3 + Math.floor(dificultad/2); // 3 a 5 preguntas
  for (let i=0; i<5; i++) {
    let preguntas = [];
    for (let j=0; j<numPreguntas; j++) {
      preguntas.push(generarPregunta(regionId, dificultad));
    }
    misiones.push({ tipo: 'mision', preguntas });
  }
  // Jefe final: una pregunta más compleja (se genera con dificultad+2)
  let jefe = generarPregunta(regionId, dificultad+2);
  misiones.push({ tipo: 'jefe', preguntas: [jefe] });
  return misiones;
}

// ---------- FUNCIONES DE ACTUALIZACIÓN DE FIREBASE ----------
async function actualizarUsuario(datos) {
  if (!uidActual) return;
  await db.collection('usuarios').doc(uidActual).update(datos);
}

async function obtenerUsuario(uid) {
  let doc = await db.collection('usuarios').doc(uid).get();
  return doc.exists ? doc.data() : null;
}

// ---------- RENDERIZADO DE MAPA ----------
function renderMapa() {
  if (!usuarioActual) return;
  let html = '';
  for (let r of REGIONES) {
    let completada = usuarioActual.progresoRegiones && usuarioActual.progresoRegiones[`region_${r.id}`]?.completada;
    let bloqueada = r.id > 1 && !(usuarioActual.progresoRegiones && usuarioActual.progresoRegiones[`region_${r.id-1}`]?.completada);
    let clase = bloqueada ? 'card' : 'card';
    let estado = bloqueada ? '🔒' : (completada ? '✅' : '▶️');
    html += `<div class="${clase}" style="cursor:pointer;" data-region="${r.id}">
      <span class="icono">${r.icono}</span>
      <strong>${r.nombre}</strong> ${estado}
      ${bloqueada ? '<span class="badge">Bloqueada</span>' : ''}
      ${completada ? '<span class="badge" style="background:#4caf50;">Completada</span>' : ''}
    </div>`;
  }
  mapaRegiones.innerHTML = html;
  // Eventos click para ingresar a región
  document.querySelectorAll('[data-region]').forEach(el => {
    el.addEventListener('click', function() {
      let regionId = parseInt(this.dataset.region);
      ingresarRegion(regionId);
    });
  });
}

// ---------- INGRESAR A REGIÓN ----------
async function ingresarRegion(regionId) {
  if (!usuarioActual) return;
  // Verificar desbloqueo
  if (regionId > 1 && !(usuarioActual.progresoRegiones && usuarioActual.progresoRegiones[`region_${regionId-1}`]?.completada)) {
    mostrarMensaje('Región bloqueada. Completa la anterior.', 'error');
    return;
  }
  // Si ya está completada, se puede rejugar (opcional)
  // Generar misiones
  let dificultad = usuarioActual.dificultadActual || 3;
  let misiones = generarMisiones(regionId, dificultad);
  misionesActuales = misiones;
  misionIndex = 0;
  regionActualData = regionId;
  enMision = true;
  // Mostrar la primera misión
  mostrarMision();
}

// ---------- MOSTRAR MISIÓN ----------
function mostrarMision() {
  if (misionIndex >= misionesActuales.length) {
    // Región completada
    completarRegion();
    return;
  }
  let mision = misionesActuales[misionIndex];
  let tipo = mision.tipo === 'jefe' ? '⚔️ JEFE FINAL' : '📜 Misión';
  let html = `<div class="card"><h3>${tipo} (${misionIndex+1}/${misionesActuales.length})</h3>`;
  // Mostrar primera pregunta de la misión (solo una a la vez)
  let pregunta = mision.preguntas[0];
  html += `<p>${pregunta.enunciado}</p>`;
  html += `<div class="flex-col">`;
  pregunta.opciones.forEach((opc, idx) => {
    html += `<button class="boton boton-secundario opcion-btn" data-opcion="${idx}">${opc}</button>`;
  });
  html += `</div></div>`;
  contenidoJuego.innerHTML = html;
  // Eventos de opciones
  document.querySelectorAll('.opcion-btn').forEach(btn => {
    btn.addEventListener('click', async function() {
      let idx = parseInt(this.dataset.opcion);
      let correcta = mision.preguntas[0].respuesta === idx;
      // Procesar respuesta
      await procesarRespuesta(correcta, mision.preguntas[0]);
      // Avanzar: quitar pregunta respondida de la misión
      mision.preguntas.shift();
      if (mision.preguntas.length === 0) {
        // Misión completada
        misionIndex++;
        // Otorgar XP base
        let xpGanado = 10 + Math.floor(Math.random()*10);
        let monedasGanadas = 5 + Math.floor(Math.random()*5);
        if (mision.tipo === 'jefe') { xpGanado *= 2; monedasGanadas *= 2; }
        await actualizarUsuario({
          xp: firebase.firestore.FieldValue.increment(xpGanado),
          monedas: firebase.firestore.FieldValue.increment(monedasGanadas),
          historial: firebase.firestore.FieldValue.arrayUnion({ fecha: new Date(), tipo: 'mision', detalle: `Completada misión ${misionIndex} región ${regionActualData}` })
        });
        // Recargar usuario
        await cargarUsuarioActual();
        mostrarMision();
      } else {
        // Mostrar siguiente pregunta de la misma misión
        mostrarMision();
      }
    });
  });
}

// ---------- PROCESAR RESPUESTA (para estadísticas) ----------
async function procesarRespuesta(correcta, pregunta) {
  // Actualizar estadísticas
  let stats = usuarioActual.estadisticas || { totalPreguntas:0, aciertos:0, errores:0, tiempoPromedio:0 };
  stats.totalPreguntas++;
  if (correcta) stats.aciertos++;
  else stats.errores++;
  await actualizarUsuario({ estadisticas: stats });
  // Aquí se podría ajustar dificultad automáticamente según aciertos/errores
}

// ---------- COMPLETAR REGIÓN ----------
async function completarRegion() {
  let progreso = usuarioActual.progresoRegiones || {};
  progreso[`region_${regionActualData}`] = { completada: true, estrellas: 3, misionesCompletadas: 5 };
  await actualizarUsuario({ 
    progresoRegiones: progreso,
    regionActual: regionActualData + 1 > 10 ? 10 : regionActualData + 1
  });
  // Verificar logros
  await verificarLogros();
  await cargarUsuarioActual();
  mostrarMensaje(`🎉 ¡Región ${regionActualData} completada!`, 'exito');
  renderMapa();
  // Volver al mapa
  cambiarVista('mapa');
}

// ---------- VERIFICAR LOGROS ----------
async function verificarLogros() {
  if (!usuarioActual) return;
  let logrosActuales = usuarioActual.logros || [];
  let nuevos = [];
  // Ejemplo: si completó región 1 y no tiene logro "Dominio Numérico"
  if (usuarioActual.progresoRegiones?.region_1?.completada && !logrosActuales.includes('Dominio Numérico')) nuevos.push('Dominio Numérico');
  // ... (se pueden añadir más condiciones para los 40 logros)
  if (nuevos.length) {
    await actualizarUsuario({ logros: firebase.firestore.FieldValue.arrayUnion(...nuevos) });
    mostrarMensaje(`🏅 Logro desbloqueado: ${nuevos.join(', ')}`, 'exito');
  }
}

// ---------- RANKING ----------
async function actualizarRanking() {
  // Obtener todos los usuarios ordenados por XP
  let snapshot = await db.collection('usuarios').orderBy('xp', 'desc').limit(20).get();
  let top = [];
  snapshot.forEach(doc => {
    let data = doc.data();
    top.push({ uid: doc.id, nickname: data.nickname, xp: data.xp, nivel: data.nivel });
  });
  await db.collection('ranking').doc('global').set({ top20: top, actualizado: new Date() });
  renderRanking(top);
}

function renderRanking(top) {
  let html = '';
  top.forEach((item, idx) => {
    html += `<div class="ranking-item"><span class="ranking-pos">#${idx+1}</span><span>${item.nickname}</span><span>${item.xp} XP</span></div>`;
  });
  rankingLista.innerHTML = html || 'No hay datos';
}

// ---------- RETOS ----------
async function cargarRetosPendientes() {
  if (!uidActual) return;
  let snapshot = await db.collection('retos').where('desafiado', '==', uidActual).where('estado', '==', 'pendiente').get();
  let html = '';
  snapshot.forEach(doc => {
    let data = doc.data();
    html += `<div class="card"><p>Reto de ${data.desafiante}</p>
      <p>${data.pregunta.enunciado}</p>
      <div class="flex-row">`;
    data.pregunta.opciones.forEach((opc, idx) => {
      html += `<button class="boton boton-secundario responder-reto" data-reto="${doc.id}" data-opcion="${idx}">${opc}</button>`;
    });
    html += `</div></div>`;
  });
  retosPendientes.innerHTML = html || 'No hay retos pendientes';
  // Eventos
  document.querySelectorAll('.responder-reto').forEach(btn => {
    btn.addEventListener('click', async function() {
      let retoId = this.dataset.reto;
      let opcion = parseInt(this.dataset.opcion);
      let retoDoc = await db.collection('retos').doc(retoId).get();
      let reto = retoDoc.data();
      let correcta = opcion === reto.pregunta.respuesta;
      let xpGanado = correcta ? 15 : 5;
      await db.collection('retos').doc(retoId).update({ estado: 'respondido', respuestaDesafiado: opcion });
      await actualizarUsuario({ xp: firebase.firestore.FieldValue.increment(xpGanado) });
      mostrarMensaje(correcta ? '¡Respuesta correcta! +15 XP' : 'Incorrecto, +5 XP', correcta ? 'exito' : 'error');
      cargarRetosPendientes();
      cargarUsuarioActual();
    });
  });
}

// ---------- ENVIAR RETO ----------
async function enviarReto(email) {
  if (!email) return;
  // Buscar usuario por email
  let snapshot = await db.collection('usuarios').where('email', '==', email).get();
  if (snapshot.empty) { mostrarMensaje('Usuario no encontrado', 'error'); return; }
  let desafiadoUid = snapshot.docs[0].id;
  if (desafiadoUid === uidActual) { mostrarMensaje('No puedes desafiarte a ti mismo', 'error'); return; }
  // Generar pregunta de la región actual
  let pregunta = generarPregunta(usuarioActual.regionActual || 1, usuarioActual.dificultadActual || 3);
  await db.collection('retos').add({
    desafiante: uidActual,
    desafiado: desafiadoUid,
    pregunta: pregunta,
    estado: 'pendiente',
    fechaEnvio: new Date()
  });
  mostrarMensaje('Reto enviado correctamente', 'exito');
  cargarRetosPendientes();
}

// ---------- CARGA DE USUARIO ACTUAL ----------
async function cargarUsuarioActual() {
  if (!uidActual) return;
  let data = await obtenerUsuario(uidActual);
  if (data) {
    usuarioActual = { ...data, uid: uidActual };
    // Actualizar UI
    $('nickname-display').textContent = data.nickname || 'Jugador';
    $('xp-display').textContent = data.xp || 0;
    $('monedas-display').textContent = data.monedas || 0;
    // Perfil
    $('perfil-nick').textContent = data.nickname || 'Sin nick';
    $('perfil-nivel').textContent = data.nivel || 1;
    $('perfil-xp').textContent = data.xp || 0;
    $('perfil-monedas').textContent = data.monedas || 0;
    $('perfil-region').textContent = data.regionActual || 1;
    $('perfil-logros').textContent = (data.logros || []).join(', ') || 'Sin logros';
    let stats = data.estadisticas || {};
    $('perfil-estadisticas').textContent = `Preguntas: ${stats.totalPreguntas||0}, Aciertos: ${stats.aciertos||0}, Errores: ${stats.errores||0}`;
    // Mostrar botón admin si rol es admin
    if (data.rol === 'admin') $('btn-admin-panel').style.display = 'block';
    else $('btn-admin-panel').style.display = 'none';
    renderMapa();
    actualizarRanking();
    cargarRetosPendientes();
  }
}

// ---------- CAMBIAR VISTA ----------
function cambiarVista(vista) {
  vistaActual = vista;
  const vistas = ['mapa','perfil','ranking','retos','admin'];
  const contenedores = {
    mapa: 'vista-mapa',
    perfil: 'vista-perfil',
    ranking: 'vista-ranking',
    retos: 'vista-retos',
    admin: 'vista-admin'
  };
  vistas.forEach(v => {
    let el = $(contenedores[v]);
    if (el) el.classList.toggle('oculto', v !== vista);
  });
  if (vista === 'ranking') actualizarRanking();
  if (vista === 'retos') cargarRetosPendientes();
  if (vista === 'mapa') renderMapa();
}

// ---------- MANEJO DE AUTENTICACIÓN ----------
auth.onAuthStateChanged(async user => {
  if (user) {
    uidActual = user.uid;
    vistaLogin.classList.add('oculto');
    vistaJuego.classList.remove('oculto');
    // Verificar si el usuario existe en Firestore, si no, crearlo
    let doc = await db.collection('usuarios').doc(uidActual).get();
    if (!doc.exists) {
      // Registro inicial: pedir nickname
      let nick = prompt('¡Bienvenido! Elige un nickname:') || 'Aventurero';
      await db.collection('usuarios').doc(uidActual).set({
        nickname: nick,
        email: user.email,
        nivel: 1,
        xp: 0,
        monedas: 0,
        regionActual: 1,
        logros: [],
        historial: [],
        estadisticas: { totalPreguntas:0, aciertos:0, errores:0, tiempoPromedio:0 },
        progresoRegiones: {},
        dificultadActual: 3,
        bloqueado: false,
        rol: 'usuario',
        fechaRegistro: new Date()
      });
      // Asignar logros iniciales? no
    }
    await cargarUsuarioActual();
    // Mostrar mensaje de bienvenida
    mostrarMensaje(`¡Hola ${usuarioActual?.nickname || 'Jugador'}!`, 'exito');
  } else {
    vistaLogin.classList.remove('oculto');
    vistaJuego.classList.add('oculto');
    uidActual = null;
    usuarioActual = null;
  }
});

});

  await db.collection('ranking').doc('global').set({ top20: [], actualizado: new Date() });
  mostrarMensajeAdmin('Ranking reiniciado');
});

$('admin-reset-monedas').addEventListener('click', async () => {
  if (!confirm('¿Reiniciar monedas de todos los usuarios?')) return;
  let snapshot = await db.collection('usuarios').get();
  let batch = db.batch();
  snapshot.forEach(doc => {
    batch.update(doc.ref, { monedas: 0 });
  });
  await batch.commit();
  mostrarMensajeAdmin('Monedas reiniciadas');
});

$('admin-reset-progreso').addEventListener('click', async () => {
  if (!confirm('¿Reiniciar progreso completo?')) return;
  let snapshot = await db.collection('usuarios').get();
  let batch = db.batch();
  snapshot.forEach(doc => {
    batch.update(doc.ref, { 
      nivel: 1, regionActual: 1, xp: 0, progresoRegiones: {}, logros: [] 
    });
  });
  await batch.commit();
  mostrarMensajeAdmin('Progreso reiniciado');
});

$('admin-reset-temporada').addEventListener('click', async () => {
  // Similar a reiniciar progreso pero manteniendo algunas cosas
  alert('Función de temporada no implementada completamente');
});

$('admin-bloquear-usuario').addEventListener('click', async () => {
  let email = prompt('Ingresa email del usuario a bloquear');
  if (!email) return;
  let snapshot = await db.collection('usuarios').where('email', '==', email).get();
  if (snapshot.empty) { alert('Usuario no encontrado'); return; }
  await snapshot.docs[0].ref.update({ bloqueado: true });
  mostrarMensajeAdmin('Usuario bloqueado');
});

$('admin-desbloquear-usuario').addEventListener('click', async () => {
  let email = prompt('Ingresa email del usuario a desbloquear');
  if (!email) return;
  let snapshot = await db.collection('usuarios').where('email', '==', email).get();
  if (snapshot.empty) { alert('Usuario no encontrado'); return; }
  await snapshot.docs[0].ref.update({ bloqueado: false });
  mostrarMensajeAdmin('Usuario desbloqueado');
});

function mostrarMensajeAdmin(texto) {
  let el = $('mensaje-admin');
  el.textContent = texto;
  el.className = 'mensaje exito';
  setTimeout(() => { el.textContent = ''; el.className = 'mensaje'; }, 4000);
}

// ---------- FUNCIÓN MOSTRAR MENSAJE ----------
function mostrarMensaje(texto, tipo='info') {
  // Se muestra en la vista actual (puede usar un div fijo)
  let el = document.createElement('div');
  el.className = `mensaje ${tipo}`;
  el.textContent = texto;
  contenidoJuego.prepend(el);
  setTimeout(() => el.remove(), 5000);
}
